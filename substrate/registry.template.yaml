# Machine truth for the spec layer. specs/REGISTRY.md renders this for humans —
# its tables are generated by `node specs/registry.mjs sync`; edit here, never
# there. `node specs/registry.mjs check` validates everything below against the
# spec files and the working tree.
#
# Statuses: unspecified | partial | adopted | contested | unspecified by design
# Paths: `path` owns the file, `path#symbol` one symbol, `dir/**` a subtree.
# plan: docs/changes/active/<date>-<spec>-<topic>.md  — required while pin ≠ file
# Boundaries start as PROPOSALS — confirm each before adopting against it.

capabilities: {}

# edges:
#   - from: <capability>
#     to: <capability>
#     source: code        # spec, once the from-capability declares it
#     reason: <one line>

# seams:
#   - path: <path every capability crosses and none owns>
#     what: <one line>
